<title>OpenDRIVE Spec Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a field guide — sticky tab bar, outline tree beside a detail sheet; lookup as one filtered list */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2226; --muted: #5d666d; --line: #d9ddd8;
  --asphalt: #2b3238; --mark: #c98a00; --mark-soft: #fbf1d6;
  --good: #1f7a4a; --good-soft: #e3f3ea; --bad: #b0352b; --bad-soft: #f8e3e0; --note: #3b5f9a; --note-soft: #e4ecf8;
  --f-display: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191c; --panel: #1d2327; --ink: #e6e9e6; --muted: #9aa3a8; --line: #2f383e;
  --asphalt: #0f1214; --mark: #f0b429; --mark-soft: #3a3016;
  --good: #5fc78e; --good-soft: #17301f; --bad: #f08a7e; --bad-soft: #3a1d1a; --note: #8fb2ea; --note-soft: #1b2638; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191c; --panel: #1d2327; --ink: #e6e9e6; --muted: #9aa3a8; --line: #2f383e;
  --asphalt: #0f1214; --mark: #f0b429; --mark-soft: #3a3016;
  --good: #5fc78e; --good-soft: #17301f; --bad: #f08a7e; --bad-soft: #3a1d1a; --note: #8fb2ea; --note-soft: #1b2638; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }
header.top { background: var(--asphalt); color: #f5f3ea; }
header.top .wrap { padding-block: 20px 0 }
h1 { font: 700 2rem/1.1 var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance }
.lede { color: #c9cdc8; max-width: 70ch; margin: 6px 0 14px }
.dash { height: 6px; background: repeating-linear-gradient(90deg, var(--mark) 0 28px, transparent 28px 46px); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--asphalt); padding: 8px 16px 0; }
.tabs button { font: 600 .95rem var(--f-body); border: 0; background: transparent; color: #c9cdc8; padding: 8px 14px; border-radius: 6px 6px 0 0; cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink) }
.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font: .85rem var(--f-mono); color: #c9cdc8; padding-bottom: 12px }
.stats b { color: var(--mark) }
section.view { padding-top: 20px }
/* mind map */
.mm { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 820px) { .mm { grid-template-columns: minmax(0, 1fr) } }
.tree { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 78vh; overflow: auto; position: sticky; top: 56px }
@media (max-width: 820px) { .tree { position: static; max-height: none } }
details.ch > summary { font: 700 1.05rem var(--f-display); cursor: pointer; padding: 6px 4px; list-style: none; display: flex; gap: 8px; align-items: baseline }
details.ch > summary::before { content: "▸"; color: var(--mark); width: 1ch }
details.ch[open] > summary::before { content: "▾" }
.chno { font: 600 .8rem var(--f-mono); color: var(--muted); min-width: 2.5ch }
.secbtn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px 4px 30px; color: var(--ink); font: .92rem var(--f-body); cursor: pointer; border-radius: 4px }
.secbtn:hover { background: var(--mark-soft) }
.secbtn[aria-current="true"] { background: var(--mark-soft); box-shadow: inset 3px 0 0 var(--mark) }
.secbtn .sid { font: .75rem var(--f-mono); color: var(--muted); margin-right: 6px }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; min-width: 0 }
.sheet h2 { font: 700 1.6rem/1.15 var(--f-display); margin: 0 0 4px; text-wrap: balance }
.crumb { font: .8rem var(--f-mono); color: var(--muted) }
.summary { max-width: 72ch; margin: 10px 0 16px }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px }
.chip { font-size: .8rem; padding: 2px 9px; border-radius: 999px; background: var(--mark-soft); color: var(--ink); border: 1px solid var(--line) }
h3 { font: 700 1.05rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px }
.formula { border-left: 3px solid var(--mark); background: var(--bg); padding: 8px 12px; margin: 8px 0; border-radius: 0 6px 6px 0; min-width: 0 }
.formula .name { font-weight: 600 }
.formula code, .expr { font: .88rem/1.5 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; display: block; margin: 4px 0 }
.small { font-size: .85rem; color: var(--muted) }
ul.list { margin: 0; padding-left: 1.2em } ul.list li { margin: 4px 0; max-width: 80ch }
.rule { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line) }
.lvl { font: 600 .72rem var(--f-mono); text-transform: uppercase; padding: 1px 6px; border-radius: 4px; height: fit-content }
.lvl.shall { background: var(--bad-soft); color: var(--bad) } .lvl.should { background: var(--note-soft); color: var(--note) } .lvl.may { background: var(--good-soft); color: var(--good) }
.rid { font: .74rem var(--f-mono); color: var(--muted); overflow-wrap: anywhere; grid-column: 2 }
.rw { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.rw > div { border-radius: 8px; padding: 10px 14px; min-width: 0 }
.rw .r { background: var(--good-soft) } .rw .w { background: var(--bad-soft) }
.rw h4 { margin: 0 0 6px; font: 700 .95rem var(--f-display); letter-spacing: .04em }
.rw .r h4 { color: var(--good) } .rw .w h4 { color: var(--bad) }
.tbl { overflow-x: auto } table { border-collapse: collapse; font-size: .85rem; width: 100% }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 600 .78rem var(--f-mono); color: var(--muted) }
td code { font: .82rem var(--f-mono) }
/* lookup */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px }
.filters input[type=search] { flex: 1 1 280px; min-width: 0; font: 1rem var(--f-body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink) }
.filters select { font: .95rem var(--f-body); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink) }
.kinds { display: flex; flex-wrap: wrap; gap: 6px }
.kinds button { font: .82rem var(--f-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.kinds button[aria-pressed="true"] { background: var(--asphalt); color: #f5f3ea; border-color: var(--asphalt) }
.count { font: .85rem var(--f-mono); color: var(--muted); margin-bottom: 8px }
.hit { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; min-width: 0 }
.hit .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: .78rem var(--f-mono); color: var(--muted); margin-bottom: 4px }
.badge { font: 600 .72rem var(--f-mono); padding: 1px 7px; border-radius: 4px; text-transform: uppercase }
.b-formula { background: var(--mark-soft); color: var(--ink) } .b-rule { background: var(--note-soft); color: var(--note) }
.b-use { background: var(--bg); color: var(--ink); border: 1px solid var(--line) } .b-right { background: var(--good-soft); color: var(--good) }
.b-wrong { background: var(--bad-soft); color: var(--bad) } .b-change { background: var(--note-soft); color: var(--note) } .b-figure { background: var(--bg); color: var(--muted); border: 1px solid var(--line) }
.hit button.go { font: .78rem var(--f-body); background: none; border: 0; color: var(--note); cursor: pointer; text-decoration: underline; padding: 0 }
mark { background: var(--mark-soft); color: inherit; border-radius: 2px }
/* figures */
.figgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px }
.fig { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0 }
.fig .pic { background: #fff; display: flex; align-items: center; justify-content: center; min-height: 120px; border-bottom: 1px solid var(--line) }
.fig .pic img { max-height: 320px; width: auto; max-width: 100%; display: block }
.fig .pic.none { background: var(--bg); color: var(--muted); font: .85rem var(--f-mono); padding: 18px; text-align: center }
.fig .body { padding: 10px 14px; display: grid; gap: 6px; min-width: 0 }
.fig .cap { font-weight: 600 }
.fig .lesson { border-left: 3px solid var(--mark); padding-left: 10px }
.fig ul { margin: 0; padding-left: 1.2em; font-size: .88rem }
.fig .rlist li::marker { content: "✓ "; color: var(--good) } .fig .wlist li::marker { content: "✗ "; color: var(--bad) }
.unseen { font: 600 .72rem var(--f-mono); color: var(--bad); text-transform: uppercase }
/* plan */
.plan { max-width: 900px }
.phase { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 14px }
.phase h2 { font: 700 1.35rem var(--f-display); margin: 0 0 4px }
.phase .why { color: var(--muted); margin: 0 0 8px; max-width: 75ch }
.phase ol { margin: 0; padding-left: 1.3em } .phase li { margin: 6px 0 }
.phase .spec { font: .78rem var(--f-mono); color: var(--note) }
.gate { border-left: 3px solid var(--good); padding-left: 12px; margin-top: 10px; font-size: .9rem }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>

<header class="top">
  <div class="wrap">
    <h1>OpenDRIVE Spec Atlas</h1>
    <p class="lede">ASAM OpenDRIVE 1.7.0 read in full, checked against 1.8 and 1.9.0: every formula, rule, use case and right or wrong modelling choice, as the reference OdrForge is built against.</p>
    <div class="stats" id="stats"></div>
  </div>
  <div class="dash" aria-hidden="true"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-map" aria-selected="true" aria-controls="v-map">Mind map</button>
    <button role="tab" id="t-look" aria-selected="false" aria-controls="v-look">Lookup</button>
    <button role="tab" id="t-figs" aria-selected="false" aria-controls="v-figs">Figures</button>
    <button role="tab" id="t-guide" aria-selected="false" aria-controls="v-guide">Junction Guideline</button>
    <button role="tab" id="t-plan" aria-selected="false" aria-controls="v-plan">Plan</button>
  </nav>
</header>

<main class="wrap">
  <section class="view" id="v-map" role="tabpanel">
    <div class="mm"><nav class="tree" id="tree" aria-label="Specification outline"></nav><article class="sheet" id="sheet"></article></div>
  </section>
  <section class="view" id="v-look" role="tabpanel" hidden>
    <div class="filters">
      <input type="search" id="q" placeholder="Search: contactPoint, width, superelevation, laneLink, roundabout…" aria-label="Search the specification">
      <select id="chap" aria-label="Chapter"></select>
    </div>
    <div class="kinds" id="kinds" role="group" aria-label="Entry types"></div>
    <p class="count" id="count"></p>
    <div id="hits"></div>
  </section>
  <section class="view" id="v-figs" role="tabpanel" hidden>
    <div class="filters">
      <input type="search" id="fq" placeholder="Search figures: lane id, contactPoint, roundabout, slip lane…" aria-label="Search figures">
      <select id="fch" aria-label="Figure source"></select>
    </div>
    <p class="count" id="fcount"></p>
    <div class="figgrid" id="figs"></div>
  </section>
  <section class="view" id="v-guide" role="tabpanel" hidden><div id="guide" class="plan"></div></section>
  <section class="view plan" id="v-plan" role="tabpanel" hidden>__PLAN__</section>
</main>

<script>
const DATA = __DATA__;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chapters = DATA.chapters;
// flatten entries for the lookup
const KINDS = [["formula","Formulas"],["rule","Rules"],["use","Use cases"],["right","Right"],["wrong","Wrong"],["change","1.8 / 1.9 changes"],["figure","Figures"]];
const entries = [];
let total = {sections:0, formula:0, rule:0, use:0, right:0, wrong:0, change:0, figure:0};
chapters.forEach(c => c.sections.forEach(s => {
  total.sections++;
  const base = {ch: c.id, chTitle: c.title, sec: s.id, secTitle: s.title};
  (s.formulas||[]).forEach(f => entries.push({...base, kind:"formula", title: f.name, body: f.expr, extra: [f.vars, f.notes].filter(Boolean).join(" · ")}));
  (s.rules||[]).forEach(r => entries.push({...base, kind:"rule", title: r.text, level: r.level, body: "", extra: [r.id, r.since && ("since " + r.since)].filter(Boolean).join(" · ")}));
  (s.use_cases||[]).forEach(u => entries.push({...base, kind:"use", title: u.case, body: u.how}));
  (s.right||[]).forEach(t => entries.push({...base, kind:"right", title: t}));
  (s.wrong||[]).forEach(t => entries.push({...base, kind:"wrong", title: t}));
  (s.changes_1_8_1_9||[]).forEach(t => entries.push({...base, kind:"change", title: t}));
  (s.figures||[]).forEach(t => entries.push({...base, kind:"figure", title: t}));
}));
entries.forEach(e => { total[e.kind]++; e.hay = (e.title + " " + (e.body||"") + " " + (e.extra||"") + " " + e.secTitle).toLowerCase(); });
document.getElementById("stats").innerHTML =
  `<span><b>${chapters.length}</b> chapters</span><span><b>${total.sections}</b> sections</span><span><b>${total.formula}</b> formulas</span><span><b>${total.rule}</b> rules</span><span><b>${total.use}</b> use cases</span><span><b>${total.right}</b> right / <b>${total.wrong}</b> wrong</span><span><b>${total.change}</b> changes in 1.8–1.9</span>`;

// tabs
const tabs = [["t-map","v-map"],["t-look","v-look"],["t-figs","v-figs"],["t-guide","v-guide"],["t-plan","v-plan"]];
function showTab(id) {
  tabs.forEach(([t, v]) => { const on = t === id; document.getElementById(t).setAttribute("aria-selected", on); document.getElementById(v).hidden = !on; });
  try { localStorage.setItem("atlas-tab", id) } catch (e) {}
}
tabs.forEach(([t]) => document.getElementById(t).addEventListener("click", () => showTab(t)));

// mind map tree
const tree = document.getElementById("tree");
tree.innerHTML = chapters.map((c, ci) => `<details class="ch"${ci === 9 ? " open" : ""}><summary><span class="chno">${esc(c.id)}</span>${esc(c.title)}</summary>` +
  c.sections.map((s, si) => `<button class="secbtn" data-c="${ci}" data-s="${si}"><span class="sid">${esc(s.id)}</span>${esc(s.title)}</button>`).join("") + `</details>`).join("");
const sheet = document.getElementById("sheet");
function list(arr, f) { return arr && arr.length ? `<ul class="list">${arr.map(f).join("")}</ul>` : "" }
function showSection(ci, si) {
  const c = chapters[ci], s = c.sections[si];
  tree.querySelectorAll(".secbtn").forEach(b => b.setAttribute("aria-current", b.dataset.c == ci && b.dataset.s == si));
  let h = `<div class="crumb">Chapter ${esc(c.id)} · ${esc(c.title)} · §${esc(s.id)}</div><h2>${esc(s.title)}</h2><p class="summary">${esc(s.summary)}</p>`;
  if (s.concepts?.length) h += `<div class="chips">${s.concepts.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
  if (s.formulas?.length) h += `<h3>Formulas</h3>` + s.formulas.map(f => `<div class="formula"><div class="name">${esc(f.name)}</div><code>${esc(f.expr)}</code>${f.vars ? `<div class="small">${esc(f.vars)}</div>` : ""}${f.notes ? `<div class="small">${esc(f.notes)}</div>` : ""}</div>`).join("");
  if (s.rules?.length) h += `<h3>Rules</h3>` + s.rules.map(r => `<div class="rule"><span class="lvl ${esc(r.level)}">${esc(r.level)}</span><span>${esc(r.text)}</span>${r.id || r.since ? `<span class="rid">${esc([r.id, r.since && "since " + r.since].filter(Boolean).join(" · "))}</span>` : ""}</div>`).join("");
  if (s.right?.length || s.wrong?.length) h += `<h3>Right and wrong</h3><div class="rw"><div class="r"><h4>Right</h4>${list(s.right, t => `<li>${esc(t)}</li>`) || "<p class='small'>none listed</p>"}</div><div class="w"><h4>Wrong</h4>${list(s.wrong, t => `<li>${esc(t)}</li>`) || "<p class='small'>none listed</p>"}</div></div>`;
  if (s.use_cases?.length) h += `<h3>Use cases</h3>` + list(s.use_cases, u => `<li><strong>${esc(u.case)}</strong>: ${esc(u.how)}</li>`);
  if (s.elements?.length) h += `<h3>Elements</h3>` + s.elements.map(el => `<p><code>${esc(el.name)}</code>${el.parent ? ` <span class="small">in ${esc(el.parent)}</span>` : ""}</p>` +
    (el.attributes?.length ? `<div class="tbl"><table><thead><tr><th>attribute</th><th>type</th><th>unit</th><th>req.</th><th>meaning</th></tr></thead><tbody>${el.attributes.map(a => `<tr><td><code>${esc(a.name)}</code></td><td><code>${esc(a.type)}</code></td><td>${esc(a.unit ?? "")}</td><td>${a.required ? "yes" : ""}</td><td>${esc(a.meaning)}</td></tr>`).join("")}</tbody></table></div>` : "")).join("");
  if (s.changes_1_8_1_9?.length) h += `<h3>Changed in 1.8 / 1.9</h3>` + list(s.changes_1_8_1_9, t => `<li>${esc(t)}</li>`);
  if (s.figures?.length) h += `<h3>Figures</h3>` + list(s.figures, t => `<li>${esc(t)}</li>`);
  sheet.innerHTML = h;
}
tree.addEventListener("click", e => { const b = e.target.closest(".secbtn"); if (b) { showSection(+b.dataset.c, +b.dataset.s); if (innerWidth < 820) sheet.scrollIntoView(); } });
// start on the junctions introduction: the chapter this plan turns on
const jc = chapters.findIndex(c => c.id === "10"); showSection(jc >= 0 ? jc : 0, 0);

// lookup
const chapSel = document.getElementById("chap");
chapSel.innerHTML = `<option value="">All chapters</option>` + chapters.map(c => `<option value="${esc(c.id)}">${esc(c.id)} ${esc(c.title)}</option>`).join("");
const active = new Set(KINDS.map(k => k[0]));
document.getElementById("kinds").innerHTML = KINDS.map(([k, n]) => `<button data-k="${k}" aria-pressed="true">${n}</button>`).join("");
document.getElementById("kinds").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const k = b.dataset.k;
  active.has(k) ? active.delete(k) : active.add(k); b.setAttribute("aria-pressed", active.has(k)); render(); });
const badge = {formula:["b-formula","formula"], rule:["b-rule","rule"], use:["b-use","use case"], right:["b-right","right"], wrong:["b-wrong","wrong"], change:["b-change","1.8/1.9"], figure:["b-figure","figure"]};
function hl(text, terms) { let t = esc(text); terms.forEach(w => { if (w.length > 1) t = t.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); }); return t; }
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase(), terms = q.split(/\s+/).filter(Boolean), ch = chapSel.value;
  const res = entries.filter(e => active.has(e.kind) && (!ch || e.ch === ch) && terms.every(t => e.hay.includes(t)));
  document.getElementById("count").textContent = `${res.length} of ${entries.length} entries` + (res.length > 300 ? " (first 300 shown, narrow the search)" : "");
  document.getElementById("hits").innerHTML = res.slice(0, 300).map(e => `<div class="hit"><div class="meta"><span class="badge ${badge[e.kind][0]}">${badge[e.kind][1]}</span>${e.level ? `<span class="lvl ${esc(e.level)}">${esc(e.level)}</span>` : ""}<span>§${esc(e.sec)} ${esc(e.secTitle)}</span><button class="go" data-ch="${esc(e.ch)}" data-sec="${esc(e.sec)}">open section</button></div>` +
    `<div>${e.kind === "formula" ? `<strong>${hl(e.title, terms)}</strong><span class="expr">${hl(e.body, terms)}</span>` : hl(e.title, terms) + (e.body ? `<div class="small">${hl(e.body, terms)}</div>` : "")}</div>` +
    (e.extra ? `<div class="small">${hl(e.extra, terms)}</div>` : "") + `</div>`).join("");
}
document.getElementById("q").addEventListener("input", render); chapSel.addEventListener("change", render);
document.getElementById("hits").addEventListener("click", e => { const b = e.target.closest(".go"); if (!b) return;
  const ci = chapters.findIndex(c => c.id === b.dataset.ch), si = chapters[ci].sections.findIndex(s => s.id === b.dataset.sec);
  showTab("t-map"); tree.querySelectorAll("details.ch")[ci].open = true; showSection(ci, si); scrollTo(0, 0); });
render();

// figures
const FG = __FIGS__;
const fch = document.getElementById("fch");
const fsrc = [...new Set(FG.figures.map(f => f.src + " · " + (f.chapter || "")))];
fch.innerHTML = `<option value="">All figures (${FG.figures.length})</option>` + fsrc.map(x => `<option>${esc(x)}</option>`).join("");
FG.figures.forEach(f => f.hay = [f.figure, f.caption, f.section, f.shows, f.lesson, f.formula, ...f.right, ...f.wrong].join(" ").toLowerCase());
function renderFigs() {
  const q = document.getElementById("fq").value.trim().toLowerCase().split(/\s+/).filter(Boolean), c = fch.value;
  const res = FG.figures.filter(f => (!c || (f.src + " · " + (f.chapter || "")) === c) && q.every(t => f.hay.includes(t)));
  document.getElementById("fcount").textContent = `${res.length} figures · ${FG.figures.filter(f => !f.viewed).length} of all could not be viewed (described from the text)`;
  document.getElementById("figs").innerHTML = res.map(f => `<article class="fig">` +
    (f.img ? `<div class="pic"><img loading="lazy" src="${esc(f.img)}" alt="${esc(f.caption || f.figure)}"></div>` : `<div class="pic none">image not available${f.viewed ? "" : " · described from the text"}</div>`) +
    `<div class="body"><div class="crumb">${esc(f.src)} · ${esc(f.figure || "")} · ${esc(f.section || f.chapter || "")}</div>` +
    `<div class="cap">${esc(f.caption || "")}</div>${f.viewed ? "" : `<span class="unseen">not viewed</span>`}` +
    (f.shows ? `<div class="small">${esc(f.shows)}</div>` : "") + (f.lesson ? `<div class="lesson">${esc(f.lesson)}</div>` : "") +
    (f.formula ? `<code class="expr">${esc(f.formula)}</code>` : "") +
    (f.right.length ? `<ul class="rlist">${f.right.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") +
    (f.wrong.length ? `<ul class="wlist">${f.wrong.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") + `</div></article>`).join("");
}
document.getElementById("fq").addEventListener("input", renderFigs); fch.addEventListener("change", renderFigs); renderFigs();

// junction guideline
const G = FG.guideline;
let gh = `<div class="phase"><h2>ASAM OpenDRIVE Junction Guideline</h2><p class="why">${esc(G.source || "")}</p>`;
if (G.use_case_table?.length) gh += `<h3>Which junction type</h3><div class="tbl"><table><thead><tr><th>situation</th><th>junction type</th><th>guideline §</th></tr></thead><tbody>` +
  G.use_case_table.map(r => `<tr><td>${esc(r.case)}</td><td>${esc(r.type)}</td><td>${esc(r.section)}</td></tr>`).join("") + `</tbody></table></div>`;
if (G.opendrive_1_7_compatibility?.length) gh += `<h3>OpenDRIVE 1.7 compatibility</h3><ul class="list">${G.opendrive_1_7_compatibility.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
gh += `</div>` + G.chapters.map(c => `<div class="phase"><h2>${esc(c.id)} ${esc(c.title)}</h2><p class="why">${esc(c.summary || "")}</p>` +
  (c.guidance?.length ? `<h3>Guidance</h3><ul class="list">${c.guidance.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") +
  (c.right?.length || c.wrong?.length ? `<div class="rw"><div class="r"><h4>Right</h4><ul class="list">${(c.right || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="w"><h4>Wrong</h4><ul class="list">${(c.wrong || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "") +
  (c.use_cases?.length ? `<h3>Use cases</h3><ul class="list">${c.use_cases.map(u => `<li><strong>${esc(u.case)}</strong>: ${esc(u.how)}</li>`).join("")}</ul>` : "") + `</div>`).join("");
document.getElementById("guide").innerHTML = gh;

try { const t = localStorage.getItem("atlas-tab"); if (t && document.getElementById(t)) showTab(t); } catch (e) {}
const hashTab = {"#plan": "t-plan", "#lookup": "t-look", "#figures": "t-figs", "#guideline": "t-guide"}[location.hash]; if (hashTab) showTab(hashTab);
</script>
